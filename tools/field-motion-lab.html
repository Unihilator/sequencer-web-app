<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Motion Lab</title>
<!--
  Dev tool: how the pointer disturbs the hero field. Open this file directly
  in a browser. The field shader is a copy of src/components/hero/shaders.ts
  (palette "Steel"); under it run two small GPU simulations:
  - turbulence: a fluid (velocity + vorticity + pressure), like a hand
    moving through smoke;
  - waves: the 2D wave equation, rings of oscillation spreading from the
    pointer's path, like a field disturbed by a moving charge.
  Both only bend and light the existing smoke; nothing is drawn on top.
-->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #eeede8;
    --muted: #9a99a3;
    --line: #ffffff22;
    --bg: #0b0c14;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: Manrope, system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .scrim {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to top,
      var(--bg) 0%,
      color-mix(in srgb, var(--bg) 50%, transparent) 35%,
      transparent 70%
    );
  }
  .hero {
    position: fixed;
    left: 40px;
    bottom: 64px;
    max-width: 560px;
    display: grid;
    gap: 18px;
    pointer-events: none;
  }
  .hero .eyebrow {
    font:
      12px/1 "JetBrains Mono",
      monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hero h1 {
    margin: 0;
    font:
      500 clamp(2rem, 5vw, 3.5rem)/1.05 "Playfair Display",
      Georgia,
      serif;
    letter-spacing: -0.015em;
  }
  .hero p {
    margin: 0;
    font-size: 18px;
    color: #eeede8cc;
  }
  .panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 320px;
    max-height: calc(100% - 32px);
    overflow: auto;
    background: #0b0b10e6;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: grid;
    gap: 16px;
    backdrop-filter: blur(10px);
    font-size: 13px;
  }
  .panel h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }
  .panel .hint {
    margin: 4px 0 0;
    color: var(--muted);
  }
  .modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .modes button,
  .out button {
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #ffffff08;
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  .modes button[aria-pressed="true"] {
    border-color: var(--ink);
    background: #ffffff18;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .sliders {
    display: grid;
    gap: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 110px 1fr 40px;
    gap: 8px;
    align-items: center;
  }
  .row[hidden] {
    display: none;
  }
  .row output {
    font:
      11px/1 "JetBrains Mono",
      monospace;
    color: var(--muted);
    text-align: right;
  }
  .out {
    display: grid;
    gap: 6px;
  }
  .out code {
    font:
      12px/1.4 "JetBrains Mono",
      monospace;
    background: #ffffff10;
    padding: 8px;
    border-radius: 6px;
    word-break: break-all;
  }
  .out button {
    justify-self: start;
    padding: 6px 12px;
  }
  .error {
    position: fixed;
    inset: auto 16px 16px;
    padding: 12px;
    border-radius: 8px;
    background: #401010;
  }
  @media (max-width: 700px) {
    .panel {
      left: 16px;
      right: 16px;
      width: auto;
      top: auto;
      bottom: 16px;
      max-height: 45%;
    }
    .hero {
      display: none;
    }
  }
</style>

<canvas id="c"></canvas>
<div class="scrim"></div>
<div class="hero">
  <span class="eyebrow">iOS · звук · веб</span>
  <h1>Звук, який можна побачити</h1>
  <p>
    Онлайн-секвенсер, генеративна графіка та інші експерименти зі звуком просто
    в браузері.
  </p>
</div>

<aside class="panel" aria-label="Налаштування руху">
  <div>
    <h2>Рух поля</h2>
    <p class="hint">
      Поводіть мишею або пальцем по хмарах. Порівняйте режими, підкрутіть
      повзунки й скопіюйте код у чат.
    </p>
  </div>
  <div class="modes" role="group" aria-label="Режим">
    <button type="button" id="mode-fluid" data-mode="fluid">
      Турбулентність
    </button>
    <button type="button" id="mode-waves" data-mode="waves">Хвилі</button>
    <button type="button" id="mode-both" data-mode="both">Разом</button>
  </div>
  <div class="sliders" id="sliders"></div>
  <div class="out">
    <h2>Код для чату</h2>
    <code id="code"></code>
    <button type="button" id="copy">Копіювати</button>
  </div>
</aside>

<script>
  // ---- Settings -----------------------------------------------------------
  // group: which mode the slider belongs to ("fluid", "waves" or both).
  const SLIDERS = [
    {
      key: "force",
      label: "Сила руху",
      min: 0,
      max: 3,
      step: 0.05,
      value: 1.5,
      group: "fluid",
    },
    {
      key: "curl",
      label: "Завихреність",
      min: 0,
      max: 60,
      step: 1,
      value: 25,
      group: "fluid",
    },
    {
      key: "fluidFade",
      label: "Згасання вихорів",
      min: 0.1,
      max: 3,
      step: 0.05,
      value: 0.8,
      group: "fluid",
    },
    {
      key: "fluidWarp",
      label: "Вигин диму",
      min: 0,
      max: 3,
      step: 0.05,
      value: 1.5,
      group: "fluid",
    },
    {
      key: "fluidLight",
      label: "Світло вихорів",
      min: 0,
      max: 2,
      step: 0.05,
      value: 0.6,
      group: "fluid",
    },
    {
      key: "waveForce",
      label: "Сила хвиль",
      min: 0,
      max: 3,
      step: 0.05,
      value: 1,
      group: "waves",
    },
    {
      key: "waveSpeed",
      label: "Швидкість хвиль",
      min: 0.2,
      max: 1,
      step: 0.05,
      value: 0.6,
      group: "waves",
    },
    {
      key: "waveFade",
      label: "Згасання хвиль",
      min: 0.1,
      max: 3,
      step: 0.05,
      value: 0.7,
      group: "waves",
    },
    {
      key: "waveWarp",
      label: "Заломлення",
      min: 0,
      max: 3,
      step: 0.05,
      value: 1.5,
      group: "waves",
    },
    {
      key: "waveLight",
      label: "Блиск хвиль",
      min: 0,
      max: 2,
      step: 0.05,
      value: 1.2,
      group: "waves",
    },
    {
      key: "radius",
      label: "Ширина руки",
      min: 0.3,
      max: 3,
      step: 0.05,
      value: 1.4,
      group: "all",
    },
  ];
  const state = { mode: "fluid" };
  for (const s of SLIDERS) state[s.key] = s.value;

  const $ = (id) => document.getElementById(id);
  const slidersEl = $("sliders");
  for (const s of SLIDERS) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.group = s.group;
    row.innerHTML = `<label for="s-${s.key}">${s.label}</label><input type="range" id="s-${s.key}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}"><output id="v-${s.key}"></output>`;
    slidersEl.append(row);
    row.querySelector("input").addEventListener("input", (e) => {
      state[s.key] = Number(e.target.value);
      renderPanel();
    });
  }
  document.querySelectorAll(".modes button").forEach((b) =>
    b.addEventListener("click", () => {
      state.mode = b.dataset.mode;
      renderPanel();
    }),
  );
  function renderPanel() {
    document
      .querySelectorAll(".modes button")
      .forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)),
      );
    document.querySelectorAll(".row").forEach((row) => {
      const g = row.dataset.group;
      row.hidden = !(g === "all" || state.mode === "both" || g === state.mode);
    });
    for (const s of SLIDERS)
      $("v-" + s.key).textContent = state[s.key].toFixed(2);
    const keys = SLIDERS.filter(
      (s) =>
        s.group === "all" || state.mode === "both" || s.group === state.mode,
    ).map((s) => `${s.key}=${state[s.key]}`);
    $("code").textContent = `motion ${state.mode} ${keys.join(" ")}`;
  }
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("code").textContent);
      $("copy").textContent = "Скопійовано";
    } catch {
      $("copy").textContent = "Виділіть текст вручну";
    }
  });
  renderPanel();

  // ---- Shaders ------------------------------------------------------------
  const VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

  const SIM_HEADER = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uTexel;
`;

  // Adds a soft "brush" along the pointer's path this frame (a -> b).
  const SPLAT_FS =
    SIM_HEADER +
    `
uniform sampler2D uTarget;
uniform vec2 uA, uB;
uniform vec4 uValue;
uniform float uRadius;
uniform float uAspect;
void main() {
  vec2 p = vUv * vec2(uAspect, 1.0);
  vec2 a = uA * vec2(uAspect, 1.0);
  vec2 b = uB * vec2(uAspect, 1.0);
  vec2 ab = b - a;
  float h = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
  float d = length(p - a - ab * h);
  outColor = texture(uTarget, vUv) + uValue * exp(-d * d / uRadius);
}`;

  const ADVECT_FS =
    SIM_HEADER +
    `
uniform sampler2D uVelocity;
uniform float uDt;
uniform float uDissipation;
void main() {
  vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexel;
  outColor = texture(uVelocity, coord) / (1.0 + uDissipation * uDt);
}`;

  const CURL_FS =
    SIM_HEADER +
    `
uniform sampler2D uVelocity;
void main() {
  float l = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).y;
  float r = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).y;
  float t = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).x;
  float b = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).x;
  outColor = vec4(0.5 * (r - l - t + b), 0.0, 0.0, 1.0);
}`;

  // Vorticity confinement: feeds the small swirls so they don't smear out.
  const VORTICITY_FS =
    SIM_HEADER +
    `
uniform sampler2D uVelocity;
uniform sampler2D uCurl;
uniform float uCurlStrength;
uniform float uDt;
void main() {
  float l = texture(uCurl, vUv - vec2(uTexel.x, 0.0)).x;
  float r = texture(uCurl, vUv + vec2(uTexel.x, 0.0)).x;
  float t = texture(uCurl, vUv + vec2(0.0, uTexel.y)).x;
  float b = texture(uCurl, vUv - vec2(0.0, uTexel.y)).x;
  float c = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(t) - abs(b), abs(r) - abs(l));
  force /= length(force) + 1e-4;
  force *= uCurlStrength * c * vec2(1.0, -1.0);
  vec2 velocity = texture(uVelocity, vUv).xy + force * uDt;
  outColor = vec4(clamp(velocity, -1000.0, 1000.0), 0.0, 1.0);
}`;

  const DIVERGENCE_FS =
    SIM_HEADER +
    `
uniform sampler2D uVelocity;
void main() {
  float l = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).x;
  float r = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).x;
  float t = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).y;
  float b = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).y;
  outColor = vec4(0.5 * (r - l + t - b), 0.0, 0.0, 1.0);
}`;

  const PRESSURE_FS =
    SIM_HEADER +
    `
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
void main() {
  float l = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float r = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float t = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  float b = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  float div = texture(uDivergence, vUv).x;
  outColor = vec4((l + r + b + t - div) * 0.25, 0.0, 0.0, 1.0);
}`;

  const GRADIENT_FS =
    SIM_HEADER +
    `
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
void main() {
  float l = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float r = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float t = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  float b = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  vec2 velocity = texture(uVelocity, vUv).xy - 0.5 * vec2(r - l, t - b);
  outColor = vec4(velocity, 0.0, 1.0);
}`;

  // Wave equation: r = height now, g = height one step ago.
  const WAVE_FS =
    SIM_HEADER +
    `
uniform sampler2D uWave;
uniform float uSpeed;   // c^2, stable below 0.5
uniform float uDamping; // per step
void main() {
  vec2 w = texture(uWave, vUv).xy;
  float l = texture(uWave, vUv - vec2(uTexel.x, 0.0)).x;
  float r = texture(uWave, vUv + vec2(uTexel.x, 0.0)).x;
  float t = texture(uWave, vUv + vec2(0.0, uTexel.y)).x;
  float b = texture(uWave, vUv - vec2(0.0, uTexel.y)).x;
  float next = 2.0 * w.x - w.y + uSpeed * (l + r + t + b - 4.0 * w.x);
  outColor = vec4(next * uDamping, w.x, 0.0, 1.0);
}`;

  // The hero field (copy of shaders.ts), bent and lit by the simulations.
  const FIELD_FS = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform vec2 uPointer;
uniform vec3 uBackground, uAccent, uAccentSoft, uSignal;
uniform sampler2D uVelocity;
uniform sampler2D uWave;
uniform vec2 uWaveTexel;
uniform float uFluidMix, uWaveMix;
uniform float uFluidWarp, uFluidLight, uWaveWarp, uWaveLight;
out vec4 outColor;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p) { float v = 0.0; float a = 0.5; mat2 r = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = r * p * 2.02; a *= 0.5; } return v; }
void main() {
  vec2 screen = gl_FragCoord.xy / uResolution;
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
  float t = uTime * 0.01;

  // Turbulence: the fluid's velocity pushes the smoke along with the hand.
  vec2 velocity = texture(uVelocity, screen).xy * uFluidMix;
  vec2 offset = velocity * 0.0004 * uFluidWarp;
  float stir = length(velocity);
  // Waves: the slope of the wave height refracts the smoke like glass.
  float hl = texture(uWave, screen - vec2(uWaveTexel.x, 0.0)).x;
  float hr = texture(uWave, screen + vec2(uWaveTexel.x, 0.0)).x;
  float hb = texture(uWave, screen - vec2(0.0, uWaveTexel.y)).x;
  float ht = texture(uWave, screen + vec2(0.0, uWaveTexel.y)).x;
  vec2 slope = vec2(hr - hl, ht - hb) * uWaveMix;
  offset += slope * 0.4 * uWaveWarp;

  // Deeper layers bend less, near wisps more: the disturbance has depth.
  float far = fbm((uv + uPointer * 0.015 - offset * 0.3) * 1.1 + vec2(0.5 * t, -0.3 * t));
  vec2 p = (uv + uPointer * 0.045 - offset) * 1.4;
  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 3.5 * q + vec2(1.7, 9.2) + 1.3 * t), fbm(p + 3.5 * q + vec2(8.3, 2.8) - 0.9 * t));
  float f = fbm(p + 3.5 * r);
  float near = smoothstep(0.52, 0.8, fbm((uv + uPointer * 0.13 - offset * 1.6) * 0.9 + vec2(-1.6 * t, 0.9 * t) + 20.0));

  vec3 color = uBackground + uAccent * 0.16 * smoothstep(0.3, 0.8, far);
  color = mix(color, uAccent * 0.8, smoothstep(0.22, 0.8, f));
  color = mix(color, uAccentSoft * 0.75, smoothstep(0.5, 0.95, f) * clamp(length(q), 0.0, 1.0));
  color += uSignal * 0.22 * smoothstep(0.62, 0.9, r.x) * smoothstep(0.5, 0.85, f);

  // Stirred smoke catches the light; only where there is smoke (f).
  color += uAccentSoft * uFluidLight * 0.18 * smoothstep(20.0, 260.0, stir) * smoothstep(0.25, 0.8, f);
  // Wave crests glint on the smoke facing the key light.
  float glint = dot(slope, normalize(vec2(-0.55, -0.4)));
  color += uAccentSoft * uWaveLight * 2.5 * glint * smoothstep(0.2, 0.75, f);

  float light = smoothstep(1.6, 0.0, length(uv - vec2(0.55, 0.4)));
  color *= 0.55 + 0.75 * light;
  color = mix(color, uBackground * 0.7, near * 0.6);
  float vignette = smoothstep(1.45, 0.25, length(uv * vec2(0.85, 1.1)));
  color = mix(uBackground * 0.6, color, mix(0.3, 1.0, vignette));
  float luma = dot(color, vec3(0.299, 0.587, 0.114));
  float grain = hash(gl_FragCoord.xy + fract(uTime * 1.37) * 517.0) - 0.5;
  color += grain * (0.042 + 0.15 * luma);
  outColor = vec4(max(color, 0.0), 1.0);
}`;

  // ---- WebGL plumbing -----------------------------------------------------
  const canvas = $("c");
  const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
  function fail(message) {
    const el = document.createElement("p");
    el.className = "error";
    el.textContent = message;
    document.body.append(el);
    throw new Error(message);
  }
  if (!gl) fail("Цей браузер не підтримує WebGL2.");
  if (
    !gl.getExtension("EXT_color_buffer_float") &&
    !gl.getExtension("EXT_color_buffer_half_float")
  )
    fail("Браузер не вміє малювати у float-текстури (EXT_color_buffer_float).");
  gl.getExtension("OES_texture_float_linear");

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
      fail("Shader: " + gl.getShaderInfoLog(shader));
    return shader;
  }
  const vertex = compile(gl.VERTEX_SHADER, VS);
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vertex);
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      fail("Link: " + gl.getProgramInfoLog(p));
    const uniforms = {};
    const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const name = gl.getActiveUniform(p, i).name;
      uniforms[name] = gl.getUniformLocation(p, name);
    }
    return { p, u: uniforms };
  }
  const programs = {
    splat: program(SPLAT_FS),
    advect: program(ADVECT_FS),
    curl: program(CURL_FS),
    vorticity: program(VORTICITY_FS),
    divergence: program(DIVERGENCE_FS),
    pressure: program(PRESSURE_FS),
    gradient: program(GRADIENT_FS),
    wave: program(WAVE_FS),
    field: program(FIELD_FS),
  };
  gl.bindVertexArray(gl.createVertexArray());

  function target(w, h) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(
      gl.TEXTURE_2D,
      0,
      gl.RGBA16F,
      w,
      h,
      0,
      gl.RGBA,
      gl.HALF_FLOAT,
      null,
    );
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(
      gl.FRAMEBUFFER,
      gl.COLOR_ATTACHMENT0,
      gl.TEXTURE_2D,
      texture,
      0,
    );
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
      fail("Float-текстура недоступна як ціль малювання.");
    return { texture, fbo, w, h };
  }
  function pingPong(w, h) {
    let read = target(w, h);
    let write = target(w, h);
    return {
      get read() {
        return read;
      },
      get write() {
        return write;
      },
      swap() {
        [read, write] = [write, read];
      },
    };
  }

  // Runs a fullscreen pass of `prog` into `dest` (null = screen).
  let unit = 0;
  function pass(prog, dest, uniforms) {
    gl.useProgram(prog.p);
    unit = 0;
    for (const [name, value] of Object.entries(uniforms)) {
      const loc = prog.u[name];
      if (loc === undefined) continue;
      if (value && value.texture) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, value.texture);
        gl.uniform1i(loc, unit++);
      } else if (typeof value === "number") gl.uniform1f(loc, value);
      else if (value.length === 2) gl.uniform2fv(loc, value);
      else if (value.length === 3) gl.uniform3fv(loc, value);
      else gl.uniform4fv(loc, value);
    }
    if (dest) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, dest.fbo);
      gl.viewport(0, 0, dest.w, dest.h);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---- Simulation state ---------------------------------------------------
  // Both simulations run well below screen resolution: the field is soft.
  const FLUID_HEIGHT = 160;
  const WAVE_HEIGHT = 256;
  let sim = null;
  function resize() {
    const s = Math.min(devicePixelRatio || 1, 1.5) * 0.5;
    canvas.width = Math.max(1, Math.round(innerWidth * s));
    canvas.height = Math.max(1, Math.round(innerHeight * s));
    const aspect = innerWidth / innerHeight;
    const fw = Math.round(FLUID_HEIGHT * aspect);
    const ww = Math.round(WAVE_HEIGHT * aspect);
    sim = {
      aspect,
      velocity: pingPong(fw, FLUID_HEIGHT),
      pressure: pingPong(fw, FLUID_HEIGHT),
      divergence: target(fw, FLUID_HEIGHT),
      curl: target(fw, FLUID_HEIGHT),
      wave: pingPong(ww, WAVE_HEIGHT),
      fluidTexel: [1 / fw, 1 / FLUID_HEIGHT],
      waveTexel: [1 / ww, 1 / WAVE_HEIGHT],
    };
  }
  addEventListener("resize", resize);
  resize();

  // Pointer: uv 0..1 (y up). Segments since the last frame are queued.
  const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
  let last = null;
  const moves = [];
  function onMove(clientX, clientY) {
    ptr.tx = (clientX / innerWidth) * 2 - 1;
    ptr.ty = 1 - (clientY / innerHeight) * 2;
    const now = {
      x: clientX / innerWidth,
      y: 1 - clientY / innerHeight,
      t: performance.now(),
    };
    if (last) moves.push([last, now]);
    last = now;
  }
  canvas.addEventListener("pointermove", (e) => {
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of events.length ? events : [e])
      onMove(ev.clientX, ev.clientY);
  });
  canvas.addEventListener("pointerleave", () => (last = null));
  canvas.addEventListener("pointerdown", (e) => {
    last = null;
    onMove(e.clientX, e.clientY);
  });

  // ---- Frame --------------------------------------------------------------
  const palette = {
    uBackground: [11 / 255, 12 / 255, 20 / 255],
    uAccent: [62 / 255, 113 / 255, 152 / 255],
    uAccentSoft: [122 / 255, 167 / 255, 1],
    uSignal: [1, 107 / 255, 74 / 255],
  };
  let time = 12;
  let prevFrame = null;
  let waveClock = 0;
  const WAVE_STEPS_PER_SECOND = 90;

  function stepFluid(dt, segments) {
    const { velocity, pressure, divergence, curl, fluidTexel, aspect } = sim;
    for (const [a, b] of segments) {
      const segDt = Math.max((b.t - a.t) / 1000, 1 / 240);
      // Pointer velocity in texels per second, capped so flicks stay sane.
      let vx = ((b.x - a.x) / segDt) * velocity.read.w;
      let vy = ((b.y - a.y) / segDt) * velocity.read.h;
      const speed = Math.hypot(vx, vy);
      const cap = 1500;
      if (speed > cap) {
        vx *= cap / speed;
        vy *= cap / speed;
      }
      pass(programs.splat, velocity.write, {
        uTarget: velocity.read,
        uA: [a.x, a.y],
        uB: [b.x, b.y],
        // Scaled by the segment's share of a frame, so the push doesn't
        // depend on how many events the browser delivers.
        uValue: [vx, vy, 0, 0].map(
          (v) => v * state.force * 0.6 * Math.min(segDt * 60, 1),
        ),
        uRadius: 0.0012 * state.radius * state.radius,
        uAspect: aspect,
        uTexel: fluidTexel,
      });
      velocity.swap();
    }
    pass(programs.curl, curl, { uVelocity: velocity.read, uTexel: fluidTexel });
    pass(programs.vorticity, velocity.write, {
      uVelocity: velocity.read,
      uCurl: curl,
      uCurlStrength: state.curl,
      uDt: dt,
      uTexel: fluidTexel,
    });
    velocity.swap();
    pass(programs.divergence, divergence, {
      uVelocity: velocity.read,
      uTexel: fluidTexel,
    });
    for (let i = 0; i < 16; i++) {
      pass(programs.pressure, pressure.write, {
        uPressure: pressure.read,
        uDivergence: divergence,
        uTexel: fluidTexel,
      });
      pressure.swap();
    }
    pass(programs.gradient, velocity.write, {
      uPressure: pressure.read,
      uVelocity: velocity.read,
      uTexel: fluidTexel,
    });
    velocity.swap();
    pass(programs.advect, velocity.write, {
      uVelocity: velocity.read,
      uDt: dt,
      uDissipation: state.fluidFade,
      uTexel: fluidTexel,
    });
    velocity.swap();
  }

  function stepWaves(dt, segments) {
    const { wave, waveTexel, aspect } = sim;
    for (const [a, b] of segments) {
      const segDt = Math.max((b.t - a.t) / 1000, 1 / 240);
      // A moving "charge" disturbs the field in proportion to the distance
      // it travels (so also independent of the event rate).
      const distance = Math.min(
        Math.hypot((b.x - a.x) * aspect, b.y - a.y),
        0.05,
      );
      pass(programs.splat, wave.write, {
        uTarget: wave.read,
        uA: [a.x, a.y],
        uB: [b.x, b.y],
        uValue: [distance * 1.5 * state.waveForce, 0, 0, 0],
        uRadius: 0.00025 * state.radius * state.radius,
        uAspect: aspect,
        uTexel: waveTexel,
      });
      wave.swap();
    }
    // Fixed time step: the wave equation is only stable that way.
    waveClock += dt;
    const damping = Math.exp(-state.waveFade / WAVE_STEPS_PER_SECOND);
    let steps = 0;
    while (waveClock >= 1 / WAVE_STEPS_PER_SECOND && steps < 4) {
      waveClock -= 1 / WAVE_STEPS_PER_SECOND;
      steps++;
      pass(programs.wave, wave.write, {
        uWave: wave.read,
        uSpeed: 0.49 * state.waveSpeed,
        uDamping: damping,
        uTexel: waveTexel,
      });
      wave.swap();
    }
    if (steps === 4) waveClock = 0;
  }

  function frame(nowMs) {
    const dt =
      prevFrame === null ? 1 / 60 : Math.min((nowMs - prevFrame) / 1000, 0.05);
    prevFrame = nowMs;
    time += dt;
    const k = 1 - Math.exp(-dt * 2.5);
    ptr.x += (ptr.tx - ptr.x) * k;
    ptr.y += (ptr.ty - ptr.y) * k;

    const segments = moves.splice(0);
    const fluidOn = state.mode !== "waves";
    const wavesOn = state.mode !== "fluid";
    // Keep both running so switching modes is instant; feed only the active.
    stepFluid(dt, fluidOn ? segments : []);
    stepWaves(dt, wavesOn ? segments : []);

    pass(programs.field, null, {
      uResolution: [canvas.width, canvas.height],
      uTime: time,
      uPointer: [ptr.x, ptr.y],
      ...palette,
      uVelocity: sim.velocity.read,
      uWave: sim.wave.read,
      uWaveTexel: sim.waveTexel,
      uFluidMix: fluidOn ? 1 : 0,
      uWaveMix: wavesOn ? 1 : 0,
      uFluidWarp: state.fluidWarp,
      uFluidLight: state.fluidLight,
      uWaveWarp: state.waveWarp,
      uWaveLight: state.waveLight,
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
